name: CI Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build web app
        run: bun run build

      - name: Typecheck (web + server)
        run: bun run typecheck

      - name: Server boot smoke
        shell: bash
        run: |
          PORT=3901 REDIS_URL=redis://localhost:6379 bun apps/server/src/index.ts > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for i in $(seq 1 15); do
            if curl -sf http://localhost:3901/api/health >/dev/null 2>&1; then
              echo "Server boot smoke: OK"
              exit 0
            fi
            sleep 1
          done
          echo "Server boot smoke: FAILED (no /api/health within 15s)" >&2
          tail -n 50 /tmp/server.log >&2 || true
          exit 1